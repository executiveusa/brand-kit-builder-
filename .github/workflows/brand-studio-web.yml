name: Brand Studio Web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/brand-studio-web.yml'
  push:
    branches:
      - 'zte/**'
    paths:
      - 'apps/web/**'
      - '.github/workflows/brand-studio-web.yml'

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
