name: PARÉ OffBrand Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '15 15 * * *'   # daily source watch
    - cron: '00 16 * * 1'   # weekly synthesis queue

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 15 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read recent OFF Brand feed items
        run: python ops/intelligence/offbrand_ingest.py --days 21 --limit 8 > /tmp/offbrand.json
      - name: Queue unseen posts as PARÉ intelligence work orders
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          data = json.loads(Path('/tmp/offbrand.json').read_text())
          repo = os.environ['GITHUB_REPOSITORY']

          for item in data['items']:
              fingerprint = item['fingerprint']
              marker = f'pare-source:{fingerprint}'
              found = subprocess.run(
                  ['gh', 'issue', 'list', '--repo', repo, '--state', 'all', '--search', marker, '--json', 'number'],
                  capture_output=True, text=True, check=True,
              )
              if json.loads(found.stdout):
                  continue

              title = f"[OFFBRAND] {item['title']}"
              body = f"""## Source\n\n- Publisher: {item['source']}\n- URL: {item['url']}\n- Published: {item['published_at']}\n- Provenance marker: `{marker}`\n\n## PARÉ work order\n\nUse the linked public source as research input. Do **not** mirror, archive, or substantially reproduce the article text. Extract durable ideas, tensions, frameworks, category observations, and design/brand lessons; then create original Pauli/PARÉ applications.\n\nRequired outputs:\n1. 3–7 durable principles or observations worth retaining.\n2. What changes an agent decision inside PARÉ, if anything.\n3. Up to 5 original content angles inspired by the subject, written from our own perspective.\n4. One client-facing application or audit question.\n5. One `KEEP / REFERENCE / DISCARD` recommendation for the design-intelligence library.\n6. Source citation and provenance.\n\nHard bans:\n- no verbatim newsletter republishing;\n- no pretending Koto's ideas are ours;\n- no adding knowledge that fails PARÉ's subtraction test;\n- no automatic canonical-brand changes without approval.\n"""
              subprocess.run(['gh', 'issue', 'create', '--repo', repo, '--title', title, '--body', body], check=True)
          PY

  weekly-synthesis:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '00 16 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: Create weekly synthesis work order when source items exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime, json, os, subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          monday = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          marker = f'pare-offbrand-week:{monday}'

          existing = subprocess.run(
              ['gh', 'issue', 'list', '--repo', repo, '--state', 'all', '--search', marker, '--json', 'number'],
              capture_output=True, text=True, check=True,
          )
          if json.loads(existing.stdout):
              raise SystemExit(0)

          source_issues = subprocess.run(
              ['gh', 'issue', 'list', '--repo', repo, '--state', 'open', '--search', '[OFFBRAND] in:title', '--limit', '20', '--json', 'number,title,url,createdAt'],
              capture_output=True, text=True, check=True,
          )
          issues = json.loads(source_issues.stdout)
          if not issues:
              raise SystemExit(0)

          lines = '\n'.join(f"- #{i['number']} — {i['title']} ({i['url']})" for i in issues)
          body = f"""## Weekly OFF Brand synthesis\n\nMarker: `{marker}`\n\nReview the open OFF Brand intelligence work orders below and produce **one compact original synthesis**, not a newsletter recap.\n\n{lines}\n\n### Output\n- strongest pattern across the source material;\n- 3 original PARÉ principles or hypotheses to test;\n- 3 content concepts we can publish in our own voice;\n- 1 product/workflow improvement worth considering;\n- 1 thing to explicitly ignore to prevent knowledge bloat;\n- citations back to each source issue used.\n\nApply the subtraction test before proposing any persistent knowledge change. Human approval is required before promoting anything into canonical design intelligence.\n"""
          subprocess.run(
              ['gh', 'issue', 'create', '--repo', repo, '--title', f'[PARE INTEL] OFF Brand weekly synthesis — {monday}', '--body', body],
              check=True,
          )
          PY
