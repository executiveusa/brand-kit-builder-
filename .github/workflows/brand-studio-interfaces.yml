name: Brand Studio Interfaces

on:
  pull_request:
    paths:
      - 'interfaces/**'
      - '.github/workflows/brand-studio-interfaces.yml'
  push:
    branches:
      - 'zte/**'
      - 'feat/**'
    paths:
      - 'interfaces/**'
      - '.github/workflows/brand-studio-interfaces.yml'

permissions:
  contents: read

jobs:
  contract-equivalence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interfaces/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Interface equivalence tests
        run: npm test

  mcp-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interfaces/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: MCP runtime tests
        run: npm test

  cli-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interfaces/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CLI runtime tests
        run: npm test
      - name: CLI capability smoke
        run: node cli.mjs capabilities
      - name: Bash launcher smoke
        run: bash ./pdfactory capabilities
